name: Signed Windows release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: signed-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.release.prerelease == false
    # Configure a dedicated Windows signing runner; this job never runs PR code.
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER || '["self-hosted","Windows","X64","velopack-signing"]') }}
    environment: release-signing
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build, test, sign, pack and upload to published release
        run: ./.github/scripts/Publish-Release.ps1
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          CERTUM_SIMPLYSIGN_EMAIL: ${{ secrets.CERTUM_SIMPLYSIGN_EMAIL }}
          CERTUM_SIMPLYSIGN_TOTP_SECRET: ${{ secrets.CERTUM_SIMPLYSIGN_TOTP_SECRET }}
          CERTUM_SIMPLYSIGN_OTP: ${{ secrets.CERTUM_SIMPLYSIGN_OTP }}
          SAFESIGN_PROVIDER: ${{ vars.SAFESIGN_PROVIDER || 'certum' }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL || 'http://time.certum.pl' }}
          SAFESIGN_FILE_PATH: ${{ vars.SAFESIGN_FILE_PATH }}
          SAFESIGN_FILE_PASSWORD: ${{ secrets.SAFESIGN_FILE_PASSWORD }}
          SAFESIGN_STORE_THUMBPRINT: ${{ vars.SAFESIGN_STORE_THUMBPRINT }}
          AZURE_CODESIGNING_ENDPOINT: ${{ vars.AZURE_CODESIGNING_ENDPOINT }}
          AZURE_CODESIGNING_ACCOUNT: ${{ vars.AZURE_CODESIGNING_ACCOUNT }}
          AZURE_CODESIGNING_PROFILE: ${{ vars.AZURE_CODESIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SAFESIGN_PATH: ${{ vars.SAFESIGN_PATH }}
          SAFESIGN_SHA256: ${{ vars.SAFESIGN_SHA256 }}
          SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNING_CERTIFICATE_THUMBPRINT }}
